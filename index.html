<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Bukti Dukung SKP DPRKP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:light;--bg:#eef6fa;--card:#fff;--tx:#183247;--mu:#61798b;--bd:#d7e6ec;--pr:#0c5274;--pr2:#168b83;--ac:#e7ad35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif}
header{background:linear-gradient(120deg,#0b4771,#168b83);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--ac);box-shadow:0 3px 12px #17445a20}
header img{width:56px;height:56px;object-fit:contain;border-radius:4px;background:#fff;padding:2px;flex:0 0 56px}
header h1{font-size:17px;margin:0}header small{opacity:.85}
#st{margin-left:auto;font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;white-space:nowrap}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:1200px;margin:auto}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px 10px 0 0;font-weight:600;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:1200px;margin:auto;padding:0 12px 24px}
.tab{display:none;background:var(--card);border:1px solid var(--bd);border-radius:0 0 12px 12px;padding:14px;box-shadow:0 8px 26px #17445a12}
.tab.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:8px 0 3px}
input,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:#fbfdfe;color:var(--tx);font:inherit;font-size:15px}
input:focus,textarea:focus{outline:2px solid #168b8340;border-color:var(--pr2)}
textarea{min-height:230px;resize:vertical}
h3{margin:16px 0 4px;color:var(--pr2);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;padding:10px 14px;border-radius:9px;font-weight:600;cursor:pointer;background:var(--pr);color:#fff;font-size:14px}
.btn.g{background:var(--bd);color:var(--tx)}.btn.r{background:#dc2626}.btn.o{background:#16a34a}.btn.w{background:#2b579a}
.card{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card b{display:block}.card span{font-size:12px;color:var(--mu)}.card .row{margin:0 0 0 auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:6px}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:#dc2626;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}
#pv{margin-top:16px;overflow:auto;background:#dcebf0;padding:10px;border-radius:10px}
#paperWrap{width:215mm;margin:auto;transform-origin:top left}
.paper{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12pt;line-height:1.5;text-align:justify}
.paper p:not(.ttl){text-align:justify}
#paper{padding:15mm 20mm;width:215mm;min-height:330mm;border:.35mm solid #0b3d91;box-shadow:0 2px 12px #0005}
.ttl{text-align:center;font-size:14pt;font-weight:bold;text-decoration:underline;margin:8px 0 24pt;line-height:1.5}
.info{width:100%;border-collapse:collapse;margin-bottom:8px}.info td{vertical-align:top;padding:1px 0}.info td:first-child{width:32mm}.info td:nth-child(2){width:5mm}
.h{font-weight:bold;margin-top:8px}.n{padding-left:7mm;text-indent:-7mm}.s{padding-left:14mm;text-indent:-7mm}.t{margin:0}
.sign{display:flex;justify-content:space-between;margin-top:22px;text-align:center;page-break-inside:avoid}.sign div{width:48%}.sign .sp{height:60px}
.doc{border-top:2px dashed #999;margin-top:24px;padding-top:12px}.doc h4{text-align:center;text-decoration:underline;margin:0 0 8px}.doc img{display:block;width:150mm;max-height:105mm;object-fit:contain;margin:0 auto 8px}
body{background:linear-gradient(180deg,#e7f2f6 0,#f4f8fa 300px,var(--bg) 100%)}
header{background:linear-gradient(115deg,#0b4771 0%,#116b7a 58%,#168b83 100%);padding:16px max(18px,calc((100vw - 1160px)/2));gap:14px;box-shadow:0 5px 18px #17445a20}
header h1{font-size:20px;letter-spacing:.15px}
header small{display:block;opacity:.9;margin-top:3px}
#st{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:6px 12px}
nav{gap:8px;padding-top:18px;max-width:1080px}
nav button{padding:13px;border-radius:12px 12px 0 0;font-weight:650;transition:background .18s,color .18s}
nav button:not(.on):hover{background:#eaf4f6;color:var(--pr)}
main{max-width:1080px;padding-bottom:34px}
.tab{padding:22px;border-radius:0 0 16px 16px;box-shadow:0 12px 34px #17445a14}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid>div:empty{display:none}
.grid>div:not(:empty){padding:5px 10px 9px;border:1px solid #e3edf1;border-radius:11px;background:#f8fbfc}
label{font-weight:650;margin:8px 0 5px}
input,textarea{padding:11px 12px;border-radius:9px;transition:border-color .16s,box-shadow .16s,background .16s}
input:hover,textarea:hover{border-color:#adcbd4}
input:focus,textarea:focus{outline:none;border-color:var(--pr2);box-shadow:0 0 0 3px #168b8324;background:#fff}
textarea{min-height:245px;line-height:1.55}
h3{margin:22px 0 7px;padding-bottom:8px;border-bottom:1px solid var(--bd);color:var(--pr);letter-spacing:.2px}
.row{gap:10px;margin-top:16px}
.btn{padding:11px 16px;border-radius:10px;font-weight:650;box-shadow:0 3px 8px #0c52741c;transition:filter .16s,transform .16s,box-shadow .16s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 12px #0c527426}
.btn:active{transform:translateY(0)}
.btn.g{background:#e6f0f2;box-shadow:none}
.btn.o{background:#168b68}
.btn.w{background:#24659a}
.card{background:#fff;border-radius:12px;padding:13px 15px;margin-top:10px;box-shadow:0 3px 10px #17445a0d}
.history-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:#f6fafb}
.history-tools span{color:var(--mu);font-size:13px;margin-right:auto}
.history-tools .btn{font-size:13px}
.history-pick{width:19px;height:19px;accent-color:var(--pr2);cursor:pointer}
#pv{margin-top:22px;background:linear-gradient(135deg,#dcebf0,#e9f2f5);padding:16px;border:1px solid #d1e2e8;border-radius:13px}
input[type=file]{background:#f8fbfc}
@media(max-width:700px){header{padding:12px 14px}header img{width:48px;height:48px;flex-basis:48px}header h1{font-size:17px}#st{font-size:10px;padding:5px 8px}nav{padding:12px 12px 0}.tab{padding:15px}.grid{grid-template-columns:1fr}.row .btn{flex:1 1 100%}#pv{padding:9px}}
</style></head><body>
<header><img id="hl" alt=""><div><h1>Bukti Dukung SKP</h1><small>Dinas Perumahan Rakyat dan Kawasan Permukiman</small></div><div id="st">Siap</div></header>
<nav><button class="on" data-t="ed">✏️ Editor</button><button data-t="hi">🕘 Riwayat</button></nav>
<main>
<section id="ed" class="tab on">
<div class="grid">
<div><label>Tanggal kegiatan</label><input type="date" id="tgl"></div>
<div><label>Hari (otomatis)</label><input id="hari" readonly></div>
<div><label>Pukul mulai</label><input type="time" id="jm" value="08:30"></div>
<div><label>Pukul selesai</label><input type="time" id="js" value="10:00"></div>
<div><label>Kegiatan</label><input id="keg" placeholder="Brifing staf"></div>
<div><label>Tempat</label><input id="tmp" placeholder="Ruangan Kepala Bidang Kawasan Permukiman"></div>
</div>
<label>Hasil kegiatan (satu baris = satu paragraf)</label>
<textarea id="has" placeholder="A. PEMBUKAAN&#10;Brifing dibuka oleh pimpinan...&#10;B. POKOK-POKOK PEMBAHASAN&#10;1. Judul poin&#10;a) rincian poin&#10;C. KESIMPULAN&#10;D. PENUTUP"></textarea>
<small style="color:var(--mu)">Baris huruf kapital / "A." otomatis tebal; "1." dan "a)" otomatis menjorok rapi.</small>
<h3>Dokumentasi foto</h3>
<input type="file" id="fo" accept="image/*" multiple><div class="thumbs" id="th"></div>
<h3>Penandatangan (opsional)</h3>
<div class="grid">
<div><label>Kota</label><input id="kota" value="Cirebon"></div><div></div>
<div><label>Nama pembuat</label><input id="nm"></div><div><label>NIP pembuat</label><input id="nip"></div>
<div><label>Jabatan pembuat</label><input id="jab"></div><div></div>
<div><label>Nama atasan</label><input id="anm"></div><div><label>NIP atasan</label><input id="anip"></div>
<div><label>Jabatan atasan</label><input id="ajab" placeholder="Kepala Bidang Kawasan Permukiman"></div><div></div>
</div>
<div class="row">
<button class="btn" id="bsave">💾 Simpan</button>
<button class="btn o" id="bpdf">⬇ Unduh PDF (F4)</button>
<button class="btn w" id="bdoc">⬇ Unduh Word</button>
<button class="btn g" id="blogo">🖼 Ganti logo DPRKP</button>
<button class="btn g" id="bnew">＋ LKH baru</button>
</div>
<input type="file" id="lg" accept="image/*" hidden>
<div id="pv"><div id="paperWrap"><div id="paper" class="paper"></div></div></div>
</section>
<section id="hi" class="tab">
<input id="q" placeholder="Cari kegiatan / tempat / tanggal…">
<div class="history-tools"><span id="selcount">Pilih beberapa kegiatan, termasuk dari tanggal berbeda, untuk digabung.</span><button class="btn o" id="mergepdf" disabled>Unduh gabungan PDF</button><button class="btn w" id="mergeword" disabled>Unduh gabungan Word</button></div>
<div id="list"></div>
</section>
</main>

function setD(d){F.forEach(k=>$(k).value=d[k]||'');cur={id:d.id,foto:d.foto||[]};$('hari').value=hari(d.tgl);thumbs();render()}
function newDoc(){const t=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);setD({id:'d'+Date.now(),tgl:t,jm:'08:30',js:'10:00',kota:'Cirebon',foto:[]});}
function parse(txt){return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
 let c='t';if(/^[A-Z]\.\s/.test(l)||(/[A-Z]{3}/.test(l)&&l===l.toUpperCase()))c='h';else if(/^\d+[.)]\s/.test(l))c='n';else if(/^[a-z][.)]\s/.test(l))c='s';return{c,l}})}
function html(d,pv){const rows=parse(d.has||'').map(r=>`<p class="t ${r.c}">${esc(r.l)}</p>`).join('');
 const sg=(d.nm||d.anm)?`<div class="sign"><div>Mengetahui,<br>${esc(d.ajab)}<div class="sp"></div><b><u>${esc(d.anm)}</u></b><br>${d.anip?'NIP. '+esc(d.anip):''}</div><div>${esc(d.kota)}, ${fmtTgl(d.tgl)}<br>${esc(d.jab||'Pelaksana')}<div class="sp"></div><b><u>${esc(d.nm)}</u></b><br>${d.nip?'NIP. '+esc(d.nip):''}</div></div>`:'';
 const ph=(d.foto||[]).length?`<div class="doc"><h4>DOKUMENTASI</h4>${d.foto.map(f=>`<img src="${f}">`).join('')}</div>`:'';
 return `<div class="ttl">BUKTI DUKUNG SKP</div>
 <table class="info"><tr><td>Hari / Tanggal</td><td>:</td><td>${hari(d.tgl)}, ${fmtTgl(d.tgl)}</td></tr><tr><td>Pukul</td><td>:</td><td>${pukul(d)}</td></tr><tr><td>Kegiatan</td><td>:</td><td>${esc(d.keg)}</td></tr><tr><td>Tempat</td><td>:</td><td>${esc(d.tmp)}</td></tr><tr><td>Hasil</td><td>:</td><td></td></tr></table>${rows}${sg}${ph}`}
function fit(){const w=$('pv').clientWidth-20,pw=215*3.7795;const z=Math.min(1,w/pw);$('paperWrap').style.zoom=z}
function render(){const p=$('paper');p.innerHTML=html(getD());p.style.background="#fff url(\"data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 215 330'><image href='"+logo()+"' x='52.5' y='110' width='110' height='110' opacity='.09'/></svg>")+"\") 0 0/215mm 330mm repeat-y";fit()}
function thumbs(){$('th').innerHTML=(cur.foto||[]).map((f,i)=>`<div><img src="${f}"><button data-i="${i}">×</button></div>`).join('')}
function stat(t){$('st').textContent=t}
function persist(){try{localStorage.setItem('lkh_v1',JSON.stringify(S))}catch(e){stat('Memori HP penuh');return false}return true}
async function cloud(d){if(!db||!uid)return;try{await db.collection('data/users/'+uid).doc(d.id).set({json:JSON.stringify(d)});if(cur&&cur.id===d.id)stat('✓ Tersimpan (cloud)')}catch(e){if(cur&&cur.id===d.id)stat('✓ Tersimpan (perangkat)')}}
function save(){const d=getD();if(!d.keg&&!d.has&&!d.tmp&&!(d.foto||[]).length){stat('Belum ada data untuk disimpan');return false}const i=S.docs.findIndex(x=>x.id===d.id);i<0?S.docs.unshift(d):S.docs[i]=d;if(!persist())return false;stat('✓ Tersimpan (perangkat)');cloud(d);return true}

function selectionUpdate(){
 const docs=S.docs.filter(d=>selectedIds.has(d.id)),count=docs.length;
 const dates=new Set(docs.map(d=>d.tgl));
 $('selcount').textContent=count===0?'Pilih beberapa kegiatan, termasuk dari tanggal berbeda, untuk digabung.':count===1?'Pilih minimal 2 kegiatan untuk digabung.':count+' kegiatan dipilih · '+(dates.size===1?fmtTgl(docs[0].tgl):dates.size+' tanggal');
 $('mergepdf').disabled=$('mergeword').disabled=count<2;
}
function selectedDocs(){
 const docs=S.docs.filter(d=>selectedIds.has(d.id));
 if(docs.length<2){stat('Pilih minimal 2 kegiatan untuk digabung');return null}
 if(docs.some(d=>!d.tgl)){stat('Isi tanggal untuk semua kegiatan sebelum menggabungkan');return null}
 return docs.sort((a,b)=>a.tgl.localeCompare(b.tgl)||(a.jm||'').localeCompare(b.jm||''));
}
function list(){const q=$('q').value.toLowerCase();const a=S.docs.filter(d=>(d.keg+d.tmp+d.tgl+fmtTgl(d.tgl)+d.has).toLowerCase().includes(q)).sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||'')||(a.jm||'').localeCompare(b.jm||''));
 $('list').innerHTML=a.length?a.map(d=>`<div class="card"><input class="history-pick" type="checkbox" aria-label="Pilih ${esc(d.keg||'kegiatan')}" data-select="${d.id}" ${selectedIds.has(d.id)?'checked':''}><div><b>${esc(d.keg||'(tanpa judul)')}</b><span>${hari(d.tgl)}, ${fmtTgl(d.tgl)} · ${esc(d.tmp)}</span></div><div class="row"><button class="btn" data-a="o" data-i="${d.id}">Buka</button><button class="btn g" data-a="c" data-i="${d.id}">Duplikat</button><button class="btn r" data-a="x" data-i="${d.id}">Hapus</button></div></div>`).join(''):'<p style="color:var(--mu)">Belum ada riwayat.</p>';

function tab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id===t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='hi')list();else fit()}
async function out(name,data){
 if(dl){try{await dl.save({filename:name,data});stat('✓ File diunduh');return}catch(e){if(e.code==='declined')return;console.error('Layanan unduhan aplikasi gagal:',e)}}
 try{
  const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);stat('✓ File diunduh');
 }catch(e){console.error(e);alert('Gagal mengunduh file: '+(e&&e.message||e))}
}
const fname=(d,e)=>{const raw=(d.keg||'kegiatan').trim().replace(/[^\p{L}\p{N}]+/gu,'').slice(0,50)||'kegiatan';const kegiatan=raw.charAt(0).toLocaleUpperCase('id-ID')+raw.slice(1).toLocaleLowerCase('id-ID');const tanggal=d.tgl?d.tgl.slice(8,10)+'-'+d.tgl.slice(5,7)+'-'+d.tgl.slice(0,4):'tanpa-tanggal';return kegiatan+'_'+tanggal+'.'+e};
const mergedFname=(docs,e)=>fname(docs[0],e);
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}

  const g=(w-ws.reduce((a,k)=>a+wid(k),0))/(ws.length-1);let cx=x;ws.forEach(k=>{p.text(k,cx,y+4.5);cx+=wid(k)+g})};
 const blk=(txt,x1,w,o={})=>{font(o.b);const ls=p.splitTextToSize(txt,w);ls.forEach((t,i)=>{need(LH);font(o.b);if(i===0&&o.m!=null)p.text(o.m,o.x0,y+4.5);line(t,x1,w,i===ls.length-1,!o.b&&o.j!==false);y+=LH});if(!ls.length)y+=LH};
 np();p.setTextColor(0);p.setFont('helvetica','bold');p.setFontSize(14);const tt='BUKTI DUKUNG SKP';p.text(tt,W/2,y+5.3,{align:'center'});const tw=wid(tt);p.setDrawColor(0);p.setLineWidth(.3);p.line(W/2-tw/2,y+6.3,W/2+tw/2,y+6.3);y+=LH*3;

  info.forEach(r=>{need(LH);font(false);p.text(r[0],L,y+4.5);p.text(':',L+32,y+4.5);blk(r[1],L+37,CW-37,{j:false})});

  A.forEach((t,i)=>p.text(t,cl,y0+4.5+LH*(i+1),{align:'center'}));B.forEach((t,i)=>p.text(t,cr,y0+4.5+LH*(i+1),{align:'center'}));
  const yn=y0+4.5+LH*(Math.max(A.length,B.length)+1)+24;font(true);
  [[d.anm,d.anip,cl],[d.nm,d.nip,cr]].forEach(([n,ip,c])=>{if(n){p.text(n,c,yn,{align:'center'});const w=wid(n);p.setLineWidth(.3);p.line(c-w/2,yn+1,c+w/2,yn+1)}font(false);if(ip)p.text('NIP. '+ip,c,yn+LH,{align:'center'})});y=yn+LH*2}

 await out(docs.length>1?mergedFname(docs,'pdf'):fname(d,'pdf'),p.output('blob'))}catch(e){console.error(e);alert('Gagal membuat PDF: '+(e&&e.message||e))}}

function resize(file,max,type){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL(type,.75))};i.src=u})}
